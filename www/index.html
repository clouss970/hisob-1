<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kirim-Chiqim</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--bd:#e3e6ea;--in:#16a34a;--out:#dc2626;--ac:#2563eb;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#8e98a5;--bd:#2b323a;--in:#4ade80;--out:#f87171;--ac:#60a5fa;--acx:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#8e98a5;--bd:#2b323a;--in:#4ade80;--out:#f87171;--ac:#60a5fa;--acx:#0b1220;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.g{margin-top:8px}
.bal{text-align:center}
.bal b.big{display:block;font-size:30px;margin:2px 0}
.mu{color:var(--mu);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{font-weight:700;padding:12px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;font-weight:600}
.seg button.on.i{background:var(--in);color:var(--acx);border-color:var(--in)}
.seg button.on.o{background:var(--out);color:var(--acx);border-color:var(--out)}
.add{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;margin-top:10px}
.mic{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;font-size:18px;padding:16px;margin-bottom:6px}
.mic.rec{background:var(--out);border-color:var(--out)}
#st{min-height:20px;margin-bottom:10px}
.bar{height:7px;border-radius:4px;background:var(--bd);overflow:hidden;margin:3px 0 9px}
.bar i{display:block;height:100%}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.it>div{flex:1;min-width:0;overflow-wrap:anywhere}
.it small{display:block;color:var(--mu)}
.it .x{width:auto;flex:none;padding:2px 10px;border:0;background:none;color:var(--mu);font-size:22px}
.it>b{white-space:nowrap}
.dh{margin:10px 0 0;font-weight:700;font-size:13px;color:var(--mu)}
.sp{display:flex;justify-content:space-between;gap:8px}
h3{margin:0 0 8px;font-size:15px}
.ord{width:auto;padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<div class="w">
<div class="tabs"><button id="t1" class="on">💰 Hisob</button><button id="t2">🤝 Qarz</button></div>
<div class="card"><input type="month" id="m"></div>

<div id="p1">
<div class="card bal"><span class="mu">Oylik balans</span><b class="big" id="bal"></b>
<div class="row"><div><span class="mu">Kirim</span><div class="in" id="ti"></div></div><div><span class="mu">Chiqim</span><div class="out" id="to"></div></div></div></div>
<div class="card">
<button class="mic" id="mic">🎤 Ovoz bilan yozish</button>
<div class="mu" id="st">Ayting: «bozorga 150 ming» yoki «oylik 3 million kirim»</div>
<div class="seg"><button class="o on" id="bo">Chiqim</button><button class="i" id="bi">Kirim</button></div>
<div class="row"><input id="a" type="number" step="0.01" inputmode="decimal" placeholder="Summa (so’m)"><select id="c"></select></div>
<input class="g" id="p" placeholder="Qayerga sarfladingiz?">
<input class="g" id="n" placeholder="Izoh (nima olindi, ixtiyoriy)">
<div class="row g"><input id="d" type="date"><input id="h" type="time"></div>
<button class="add" id="ad">Qo’shish</button>
</div>
<div class="card" id="grp"></div>
<div class="card"><div class="sp"><h3>Yozuvlar (vaqt bo’yicha)</h3><button class="ord" id="ord">Yangi ↓</button></div><div id="list"></div></div>
</div>

<div id="p2" style="display:none">
<div class="card bal"><span class="mu">Shu oy qarzlar</span>
<div class="row"><div><span class="mu">Berganim</span><b class="big out" id="qb"></b></div><div><span class="mu">Olganim</span><b class="big in" id="qo"></b></div></div></div>
<div class="card"><h3>Qarz yozish</h3>
<select id="qt"><option value="b">Qarz berdim (−)</option><option value="o">Qarz oldim (+)</option><option value="qd">Qaytardim (−)</option><option value="qo">Menga qaytarishdi (+)</option></select>
<input class="g" id="qn" placeholder="Kim bilan? (ism)">
<input class="g" id="qa" type="number" step="0.01" inputmode="decimal" placeholder="Summa (so’m)">
<input class="g" id="qm" placeholder="Izoh (ixtiyoriy)">
<div class="row g"><input id="qd" type="date"><input id="qh" type="time"></div>
<button class="add" id="qad">Qo’shish</button></div>
<div class="card" id="qs"></div>
<div class="card"><h3>Shu oy qarz yozuvlari</h3><div id="ql"></div></div>
</div>
</div>
<script>
var CO=["Oziq-ovqat","Transport","Uy-joy","Kommunal","Kiyim","Sog’liq","Ko’ngilochar","Boshqa"];
var CI=["Oylik","Qo’shimcha daromad","Sovg’a","Boshqa"];
var DT={b:["Qarz berdim",-1],o:["Qarz oldim",1],qd:["Qaytardim",-1],qo:["Menga qaytarishdi",1]};
var items=[],debts=[],type="o",asc=false,$=function(i){return document.getElementById(i)};
try{items=JSON.parse(localStorage.getItem("kc")||"[]")}catch(e){}
try{debts=JSON.parse(localStorage.getItem("kd")||"[]")}catch(e){}
items.forEach(function(x){if(!x.p)x.p=x.n||x.c;if(!x.h)x.h="00:00"});
function save(){try{localStorage.setItem("kc",JSON.stringify(items));localStorage.setItem("kd",JSON.stringify(debts))}catch(e){}}
function r2(n){return Math.round(n*100)/100}
function f(n){n=r2(n);return n.toLocaleString("ru-RU",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" so’m"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function p2(n){return String(n).padStart(2,"0")}
function ds(t){return t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate())}
function today(){return ds(new Date())}
function hm(){var t=new Date();return p2(t.getHours())+":"+p2(t.getMinutes())}
function fill(){$("c").innerHTML=(type=="o"?CO:CI).map(function(x){return"<option>"+x+"</option>"}).join("");$("p").placeholder=type=="o"?"Qayerga sarfladingiz? (aniq yozing)":"Qayerdan keldi? (aniq yozing)"}
function setType(t){type=t;$("bo").className="o"+(t=="o"?" on":"");$("bi").className="i"+(t=="i"?" on":"");fill()}
$("bo").onclick=function(){setType("o")};$("bi").onclick=function(){setType("i")};
var touched=false;
function now(){$("d").value=today();$("h").value=hm();$("qd").value=today();$("qh").value=hm()}
now();setInterval(function(){if(!touched)now()},20000);
["d","h","qd","qh"].forEach(function(i){$(i).oninput=function(){touched=true}});
$("m").value=today().slice(0,7);$("m").onchange=render;
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
function tab(n){$("p1").style.display=n==1?"":"none";$("p2").style.display=n==2?"":"none";$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":""}
$("ord").onclick=function(){asc=!asc;$("ord").textContent=asc?"Eski ↑":"Yangi ↓";render()};
function key(x){return x.d+" "+(x.h||"00:00")+" "+String(x.id).padStart(15,"0")}
function srt(L){L.sort(function(a,b){return key(a)<key(b)?-1:1});if(!asc)L.reverse();return L}
$("ad").onclick=function(){
var v=r2(parseFloat($("a").value));if(!(v>0)){$("a").focus();return}
var p=$("p").value.trim();if(!p){$("p").focus();$("p").placeholder=type=="o"?"Qayerga ketganini yozing!":"Qayerdan kelganini yozing!";return}
var d=$("d").value||today();
items.push({id:Date.now(),t:type,a:v,c:$("c").value,p:p,n:$("n").value.trim(),d:d,h:$("h").value||hm()});
save();$("a").value="";$("p").value="";$("n").value="";touched=false;now();$("m").value=d.slice(0,7);render()};
$("qad").onclick=function(){
var v=r2(parseFloat($("qa").value)),nm=$("qn").value.trim();
if(!nm){$("qn").focus();return}if(!(v>0)){$("qa").focus();return}
var d=$("qd").value||today();
debts.push({id:Date.now(),t:$("qt").value,a:v,w:nm,n:$("qm").value.trim(),d:d,h:$("qh").value||hm()});
save();$("qa").value="";$("qn").value="";$("qm").value="";touched=false;now();$("m").value=d.slice(0,7);render()};
function del(id){items=items.filter(function(x){return x.id!=id});save();render()}
function delD(id){debts=debts.filter(function(x){return x.id!=id});save();render()}
function grp(t,L,cl,tot,fld){
var mp={},nm={};L.forEach(function(x){var s=x[fld],k=s.toLowerCase();mp[k]=(mp[k]||0)+x.a;nm[k]=nm[k]||s});
var k=Object.keys(mp).sort(function(a,b){return mp[b]-mp[a]});if(!k.length)return"";
return"<h3>"+t+"</h3>"+k.map(function(c){return"<div class='sp'><span>"+esc(nm[c])+"</span><span class='"+cl+"'>"+f(mp[c])+"</span></div><div class='bar'><i style='background:var(--"+cl+");width:"+(mp[c]/tot*100)+"%'></i></div>"}).join("")}
function rows(L,fn){var h="",last="";L.forEach(function(x){if(x.d!=last){last=x.d;h+="<div class='dh'>"+x.d+"</div>"}h+=fn(x)});return h||"<span class='mu'>Hozircha yozuv yo’q</span>"}
function render(){
var m=$("m").value,L=items.filter(function(x){return x.d.slice(0,7)==m}),ti=0,to=0;
var I=L.filter(function(x){return x.t=="i"}),O=L.filter(function(x){return x.t=="o"});
I.forEach(function(x){ti+=x.a});O.forEach(function(x){to+=x.a});
$("ti").textContent=f(ti);$("to").textContent=f(to);
var b=r2(ti-to);$("bal").textContent=f(b);$("bal").className="big "+(b<0?"out":"in");
$("grp").innerHTML=(grp("Qayerga ketdi",O,"out",to,"p")+(O.length&&I.length?"<hr style='border:0;border-top:1px solid var(--bd);margin:12px 0'>":"")+grp("Qayerdan keldi",I,"in",ti,"p"))||"<span class='mu'>Bu oyda yozuv yo’q</span>";
$("list").innerHTML=rows(srt(L.slice()),function(x){return"<div class='it'><div><b>"+esc(x.p)+"</b><small>"+x.h+" · "+esc(x.c)+(x.n?" · "+esc(x.n):"")+"</small></div><b class='"+(x.t=="i"?"in":"out")+"'>"+(x.t=="i"?"+":"−")+f(x.a)+"</b><button class='x' onclick='del("+x.id+")' aria-label='O’chirish'>×</button></div>"});
var DL=debts.filter(function(x){return x.d.slice(0,7)==m}),qb=0,qo=0;
DL.forEach(function(x){if(x.t=="b")qb+=x.a;if(x.t=="o")qo+=x.a});
$("qb").textContent="−"+f(qb);$("qo").textContent="+"+f(qo);
var net={},nn={};debts.forEach(function(x){var k=x.w.toLowerCase();nn[k]=nn[k]||x.w;net[k]=(net[k]||0)+(x.t=="b"||x.t=="qo"?(x.t=="b"?1:-1):(x.t=="o"?-1:1))*x.a});
var ks=Object.keys(net).filter(function(k){return Math.abs(net[k])>=0.01});
$("qs").innerHTML="<h3>Hozirgi holat (kim kimga qarz)</h3>"+(ks.length?ks.map(function(k){var v=net[k];return"<div class='sp'><span>"+esc(nn[k])+"</span><span class='"+(v>0?"in":"out")+"'>"+(v>0?"sizga qarz: +":"siz qarz: −")+f(Math.abs(v))+"</span></div>"}).join(""):"<span class='mu'>Ochiq qarz yo’q</span>");
$("ql").innerHTML=rows(srt(DL.slice()),function(x){var s=DT[x.t][1];return"<div class='it'><div><b>"+esc(x.w)+"</b><small>"+x.h+" · "+DT[x.t][0]+(x.n?" · "+esc(x.n):"")+"</small></div><b class='"+(s>0?"in":"out")+"'>"+(s>0?"+":"−")+f(x.a)+"</b><button class='x' onclick='delD("+x.id+")' aria-label='O’chirish'>×</button></div>"})}
function st(s){$("st").textContent=s}
var KW={"Oziq-ovqat":/non|bozor|ovqat|market|gosht|sut|meva|sabzavot|oziq|choy|restoran/,"Transport":/taksi|benzin|avtobus|metro|yol|yandex|transport|mashina/,"Kommunal":/svet|gaz|suv|internet|kommunal|elektr/,"Uy-joy":/ijara|uy\b|remont/,"Kiyim":/kiyim|oyoq|ko.ylak|shim/,"Sog’liq":/dori|apteka|shifokor|doktor|davolan/,"Ko’ngilochar":/kino|kafe|oyin|konsert|dam olish/};
function handle(s){
var t=s.toLowerCase().replace(/[ʻ’'`]/g,"").replace(/(\d)\s+(?=\d{3}(\D|$))/g,"$1");
var m=t.match(/(\d+(?:[.,]\d+)?)\s*(ming|k|million|mln|milyon)?/);
if(!m){st("Summa eshitilmadi: «"+s+"». Raqam bilan ayting, masalan «taksi 20 ming».");return}
var a=parseFloat(m[1].replace(",",".")),u=m[2];
if(u=="ming"||u=="k")a*=1000;else if(u)a*=1000000;a=r2(a);
var ty=/kirim|daromad|oylik|maosh|tushdi|oldim/.test(t)?"i":"o",c="Boshqa";
if(ty=="i"){if(/oylik|maosh/.test(t))c="Oylik"}else for(var k in KW){if(KW[k].test(t)){c=k;break}}
var p=t.replace(m[0]," ").replace(/\b(kirim|chiqim|kecha|som|sum|soum|so.m)\b/g," ").replace(/\s+/g," ").trim();
p=p?p.charAt(0).toUpperCase()+p.slice(1):c;
var d=today();if(/kecha/.test(t))d=ds(new Date(Date.now()-864e5));
items.push({id:Date.now(),t:ty,a:a,c:c,p:p,n:s,d:d,h:hm()});save();
$("m").value=d.slice(0,7);render();
st("✅ "+(ty=="i"?"Kirim: ":"Chiqim: ")+f(a)+" · "+p+". Xato bo’lsa, × bilan o’chiring.")}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,on=false;
$("mic").onclick=function(){
if(!SR){st("Bu brauzerda ovoz yozish ishlamaydi. Chrome’da oching yoki klaviaturadagi 🎤 dan foydalaning.");return}
if(on){rec.stop();return}
rec=new SR();rec.lang="uz-UZ";rec.interimResults=false;
rec.onstart=function(){on=true;$("mic").className="mic rec";$("mic").textContent="⏹ Eshitayapman… ayting";st("")};
rec.onresult=function(e){handle(e.results[0][0].transcript)};
rec.onerror=function(e){st(e.error=="not-allowed"?"Mikrofonga ruxsat berilmagan. Brauzer sozlamasidan ruxsat bering.":"Xatolik: "+e.error)};
rec.onend=function(){on=false;$("mic").className="mic";$("mic").textContent="🎤 Ovoz bilan yozish"};
try{rec.start()}catch(e){st("Boshlab bo’lmadi, qayta urinib ko’ring.")}};
fill();render();
</script>
</body>
</html>
